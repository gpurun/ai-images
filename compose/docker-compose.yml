# =============================================================================
# Docker Compose example for video-minimax-h3-singularity product
# Usage:
#   docker-compose up -d
#   docker-compose logs -f
# Access ComfyUI: http://localhost:8188
# =============================================================================

version: '3.8'

services:
  minimax-h3-singularity:
    image: ghcr.io/gpurun/product/video-minimax-h3-singularity:v1
    container_name: minimax-h3-singularity
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    ports:
      - "8188:8188"
    
    volumes:
      # Model weights storage (persistent)
      - ./data/models:/models
      # Generated video output
      - ./data/output:/output
      # Input images/videos
      - ./data/input:/input
    
    environment:
      # ComfyUI service port
      - COMFYUI_PORT=8188
      
      # Weight management
      - WEIGHTS_ROOT=/models
      - HF_REPO=WarmBloodAban/Minimax-h3_Singularity
      - DIFFUSION_FILE=Minimax-h3_Singularity_ref2va_v1.3_Pruned_w4a8.safetensors
      
      # Auto-download on first run (optional)
      - AUTO_DOWNLOAD_WEIGHTS=1
      # Provide HF token for gated models (optional)
      # - HF_TOKEN=your_huggingface_token_here
      
      # Logging
      - LOG_LEVEL=INFO
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    
    restart: unless-stopped
    
    # Optional: limit memory if needed
    # mem_limit: 64g
    # shm_size: 16g

# Optional: add other services
# services:
#   vllm-backend:
#     image: ghcr.io/gpurun/engine/vllm:v0.8.5
#     ...
