name: deepseek-v4-1-flash-sglang

services:
  deepseek-v4-1-flash-sglang:
    build:
      context: ../..
      dockerfile: products/deepseek-v4.1-flash/Dockerfile
      args:
        ENGINE: sglang
        TAG: latest
    image: ai-images/deepseek-v4-1-flash:sglang-latest
    container_name: deepseek-v4-1-flash-sglang
    restart: unless-stopped
    ports:
      - "${SGLANG_PORT:-30000}:30000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface/transformers
    volumes:
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
    ipc: host
    shm_size: ${SHM_SIZE:-128g}
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model-path
      - ${MODEL_PATH:-deepseek-ai/DeepSeek-V4.1}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-DeepSeek-V4.1-Flash}
      - --host
      - ${HOST:-0.0.0.0}
      - --port
      - "30000"
      - --tp-size
      - "${TP_SIZE:-8}"
      - --ep-size
      - "${EP_SIZE:-8}"
      - --enable-ep-moe
      - --context-length
      - "${CONTEXT_LENGTH:-1048576}"
      - --max-running-requests
      - "${MAX_RUNNING_REQUESTS:-64}"
      - --max-prefill-tokens
      - "${MAX_PREFILL_TOKENS:-65536}"
      - --chunked-prefill-size
      - "${CHUNKED_PREFILL_SIZE:-4096}"
      - --mem-fraction-static
      - "${MEM_FRACTION_STATIC:-0.90}"
      - --attention-backend
      - "${SGLANG_ATTENTION_BACKEND:-flashmla}"
      - --moe-runner-backend
      - "${SGLANG_MOE_RUNNER_BACKEND:-deep_gemm}"
      - --kv-cache-dtype
      - "${KV_CACHE_DTYPE:-fp8_e4m3}"
      - ${ENABLE_MTP:+--speculative-config}
      - ${ENABLE_MTP:+"{\"method\":\"mtp\",\"num_speculative_tokens\":${MTP_NUM_SPECULATIVE_TOKENS:-2}}"}
      - --enable-metrics
      - ${DISABLE_LOG_REQUESTS:+--disable-log-requests}
      - --log-level
      - ${LOG_LEVEL:-info}
